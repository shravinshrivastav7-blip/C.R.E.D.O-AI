    function parseCSV(text) {
      const lines = text.trim().split(/\r\n|\n/);
      if (lines.length < 2) return { headers: [], rows: [] };
      const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const values = lines[i].split(',').map(v => v.trim().replace(/^["']|["']$/g, ''));
        if (values.length === headers.length) {
          const rowObj = {};
          headers.forEach((h, idx) => {
            const val = values[idx];
            const num = Number(val);
            rowObj[h] = !isNaN(num) && val !== '' ? num : val;
          });
          rows.push(rowObj);
        }
      }
      return { headers, rows };
    }

    function calculateStats(numbers) {
      const valid = numbers.filter(n => typeof n === 'number' && !isNaN(n));
      if (valid.length === 0) return { mean: 0, stdDev: 0, min: 0, max: 0, count: 0 };
      const count = valid.length;
      const mean = valid.reduce((a, b) => a + b, 0) / count;
      const variance = valid.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / count;
      const stdDev = Math.sqrt(variance);
      const min = Math.min(...valid);
      const max = Math.max(...valid);
      return { mean, stdDev, min, max, count };
    }

    function linearRegression(xArr, yArr) {
      const n = xArr.length;
      if (n === 0 || n !== yArr.length) return { slope: 0, intercept: 0, r2: 0 };
      
      let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0, sumYY = 0;
      for (let i = 0; i < n; i++) {
        sumX += xArr[i];
        sumY += yArr[i];
        sumXY += xArr[i] * yArr[i];
        sumXX += xArr[i] * xArr[i];
        sumYY += yArr[i] * yArr[i];
      }
      
      const denominator = (n * sumXX - sumX * sumX);
      if (denominator === 0) return { slope: 0, intercept: 0, r2: 0 };
      
      const slope = (n * sumXY - sumX * sumY) / denominator;
      const intercept = (sumY - slope * sumX) / n;
      
      const yMean = sumY / n;
      let ssTot = 0, ssRes = 0;
      for (let i = 0; i < n; i++) {
        const yPred = slope * xArr[i] + intercept;
        ssTot += Math.pow(yArr[i] - yMean, 2);
        ssRes += Math.pow(yArr[i] - yPred, 2);
      }
      const r2 = ssTot === 0 ? 0 : Math.max(0, 1 - (ssRes / ssTot));
      
      return { slope, intercept, r2 };
    }

    function computePearsonCorrelation(xArr, yArr) {
      const n = xArr.length;
      if (n < 2 || n !== yArr.length) return 0;
      const xMean = xArr.reduce((a, b) => a + b, 0) / n;
      const yMean = yArr.reduce((a, b) => a + b, 0) / n;
      
      let num = 0, xDen = 0, yDen = 0;
      for (let i = 0; i < n; i++) {
        const xDiff = xArr[i] - xMean;
        const yDiff = yArr[i] - yMean;
        num += xDiff * yDiff;
        xDen += xDiff * xDiff;
        yDen += yDiff * yDiff;
      }
      const den = Math.sqrt(xDen * yDen);
      return den === 0 ? 0 : num / den;
    }

    function trainNaiveBayesClassifier(dataset, featureCols, targetCol) {
      if (!dataset || dataset.length < 4) return null;
      
      const shuffled = [...dataset].sort(() => 0.5 - Math.random());
      const splitIdx = Math.floor(shuffled.length * 0.7);
      const trainData = shuffled.slice(0, splitIdx);
      const testData = shuffled.slice(splitIdx);
      
      const classes = [...new Set(dataset.map(r => String(r[targetCol])))];
      if (classes.length < 2) return null;
      
      const classCounts = {};
      classes.forEach(c => classCounts[c] = trainData.filter(r => String(r[targetCol]) === c).length);
      
      const stats = {};
      classes.forEach(c => {
        stats[c] = {};
        const classRows = trainData.filter(r => String(r[targetCol]) === c);
        featureCols.forEach(f => {
          const vals = classRows.map(r => Number(r[f])).filter(n => !isNaN(n));
          const s = calculateStats(vals);
          stats[c][f] = { mean: s.mean || 0.001, stdDev: s.stdDev || 0.001 };
        });
      });
      
      const predictSample = (sample) => {
        let bestClass = classes[0];
        let maxLogProb = -Infinity;
        
        classes.forEach(c => {
          const prior = (classCounts[c] || 1) / trainData.length;
          let logProb = Math.log(prior);
          
          featureCols.forEach(f => {
            const val = Number(sample[f]);
            if (!isNaN(val)) {
              const { mean, stdDev } = stats[c][f];
              const stdev2 = Math.pow(stdDev, 2) + 1e-6;
              const pdf = (1 / (Math.sqrt(2 * Math.PI) * stdDev)) * Math.exp(-Math.pow(val - mean, 2) / (2 * stdev2));
              logProb += Math.log(Math.max(pdf, 1e-9));
            }
          });
          
          if (logProb > maxLogProb) {
            maxLogProb = logProb;
            bestClass = c;
          }
        });
        return bestClass;
      };
      
      let correct = 0;
      const confusionMatrix = {};
      classes.forEach(c1 => {
        confusionMatrix[c1] = {};
        classes.forEach(c2 => confusionMatrix[c1][c2] = 0);
      });
      
      testData.forEach(row => {
        const actual = String(row[targetCol]);
        const pred = predictSample(row);
        if (actual === pred) correct++;
        if (confusionMatrix[actual] && confusionMatrix[actual][pred] !== undefined) {
          confusionMatrix[actual][pred]++;
        }
      });
      
      const accuracy = testData.length > 0 ? (correct / testData.length) * 100 : 0;
      
      const featureImportance = {};
      featureCols.forEach(f => {
        const means = classes.map(c => stats[c][f].mean);
        const meanStats = calculateStats(means);
        featureImportance[f] = meanStats.stdDev;
      });
      
      const totalImp = Object.values(featureImportance).reduce((a, b) => a + b, 0) || 1;
      Object.keys(featureImportance).forEach(k => {
        featureImportance[k] = (featureImportance[k] / totalImp) * 100;
      });

      return {
        classes,
        accuracy,
        confusionMatrix,
        featureImportance,
        predictSample,
        trainCount: trainData.length,
        testCount: testData.length
      };
    }

    async function callGeminiAPI(prompt, systemInstruction = "", userApiKey = "") {
      const apiKey = userApiKey || ""; 
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
      };
      
      if (systemInstruction) {
        payload.systemInstruction = { parts: [{ text: systemInstruction }] };
      }
      
      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`API Error ${res.status}: ${errText}`);
        }
        
        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("Received an empty response from the AI intelligence model.");
        return text;
      } catch (error) {
        console.error("Gemini API Error:", error);
        throw error;
      }
    }

                          </div>

                          <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
                            <span className="text-slate-400 font-bold text-[10px] uppercase block">Key Strengths</span>
                            <ul className="list-disc list-inside text-[#235327] font-medium">
                              {labFeedback.strengths?.map((s, i) => <li key={i}>{s}</li>)}
                            </ul>
                          </div>

                          <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
                            <span className="text-slate-400 font-bold text-[10px] uppercase block">Model Breakdown</span>
                            <p className="text-slate-700 leading-relaxed">{labFeedback.scientificExplanation}</p>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* DATA EXPLORER TAB */}
            {activeTab === 'analysis' && (
              <div className="space-y-6">
                <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-2xs">
                  <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <Icon name="barchart" className="w-5 h-5 text-[#235327]" />
                    General Dataset Explorer
                  </h2>
                  
                  <div className="flex flex-col md:flex-row items-center justify-between gap-4">
                    <p className="text-xs text-slate-500">Upload any custom CSV dataset for statistical inspection and automated AI hypothesis suggestions.</p>
                    <label className="cursor-pointer px-4 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-[#235327] text-xs font-bold rounded-xl transition-all flex items-center gap-2">
                      <Icon name="upload" className="w-4 h-4" />
                      <span>Choose CSV</span>
                      <input type="file" accept=".csv" onChange={handleGeneralFileUpload} className="hidden" />
                    </label>
                  </div>

                  {generalData.rows.length === 0 ? (
                    <div className="border border-dashed border-slate-200 rounded-2xl p-8 text-center text-xs text-slate-400 bg-slate-50/50">
                      Upload a CSV file to inspect structure.
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <button onClick={handleRunGeneralAnalysis} className="w-full py-2 bg-[#235327] hover:bg-[#1b411f] text-white font-bold rounded-xl text-xs transition-all shadow-xs">
                        Analyze Loaded Dataset ({generalData.rows.length} rows, {generalData.headers.length} cols)
                      </button>

                      {generalAnalysisResult && (
                        <div className="space-y-4 text-xs">
                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                            <span className="text-slate-400 font-bold text-[10px] uppercase block">Overview</span>
                            <p className="text-slate-800">{generalAnalysisResult.ai.overview}</p>
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2">
                            <span className="text-slate-400 font-bold text-[10px] uppercase block">Suggested Scientific Hypotheses</span>
                            <ul className="list-disc list-inside text-[#235327] font-medium space-y-1">
                              {generalAnalysisResult.ai.suggestedHypotheses?.map((h, i) => <li key={i}>{h}</li>)}
                            </ul>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* SIMULATOR TAB */}
            {activeTab === 'simulator' && (
              <div className="space-y-6">
                <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-2xs">
                  <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <Icon name="sliders" className="w-5 h-5 text-[#235327]" />
                    Interactive Physical Experiment Simulator
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {['cooling', 'photosynthesis', 'evaporation'].map(st => (
                      <button
                        key={st}
                        onClick={() => setSimType(st)}
                        className={`p-3 rounded-xl border text-xs font-semibold capitalize transition-all ${
                          simType === st ? 'bg-emerald-50 border-[#235327] text-[#235327] font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'
                        }`}
                      >
                        {st} Simulation Model
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div className="space-y-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <label className="text-slate-700 font-semibold block">Temperature (°C): {simParams.temp}</label>
                      <input type="range" min="0" max="100" value={simParams.temp} onChange={(e) => setSimParams({ ...simParams, temp: Number(e.target.value) })} className="w-full accent-[#235327]" />
                    </div>
                    <div className="space-y-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                      <label className="text-slate-700 font-semibold block">Surface Area / Light: {simParams.surfaceArea}</label>
                      <input type="range" min="10" max="100" value={simParams.surfaceArea} onChange={(e) => setSimParams({ ...simParams, surfaceArea: Number(e.target.value) })} className="w-full accent-[#235327]" />
                    </div>
                  </div>

                  <button onClick={handleRunSimulation} className="w-full py-2.5 bg-[#235327] hover:bg-[#1b411f] text-white font-bold rounded-xl text-xs transition-all shadow-xs">
                    Run Simulation Calculations & AI Model
                  </button>

                  {simResult && (
                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-2 text-xs">
                      <span className="text-[#235327] font-mono font-bold text-[11px] block">{simResult.mathSummary}</span>
                      <p className="text-slate-700">{simResult.ai.qualitativeEffect}</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* EXHIBITION TAB */}
            {activeTab === 'exhibition' && (
              <div className="space-y-8 py-4">
                <div className="text-center max-w-2xl mx-auto space-y-3">
                  <CredoWorldSchoolLogo size="lg" />
                  <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-[#235327] text-xs font-semibold">
                    <Icon name="sparkles" className="w-3.5 h-3.5 text-[#D9383A]" />
                    <span>Science Fair & Exhibition Mode</span>
                  </div>
                  <h1 className="text-3xl font-black text-slate-900">Interactive Student Demonstration</h1>
                  <p className="text-xs text-slate-500 font-medium">Select a scientific intelligence module to test live.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
                  {[
                    { id: 'discovery', title: '🔬 DISCOVER', desc: 'Formulate hypotheses and experimental protocols live.', border: 'border-emerald-300 hover:border-[#235327]', bg: 'bg-emerald-50/40 text-[#235327]' },
                    { id: 'climate', title: '🌍 PREDICT', desc: 'Run linear regressions on environmental CSV datasets.', border: 'border-red-300 hover:border-[#D9383A]', bg: 'bg-red-50/40 text-[#D9383A]' },
                    { id: 'health', title: '🧬 DETECT', desc: 'Train Naïve Bayes classifiers on health metrics.', border: 'border-amber-300 hover:border-amber-600', bg: 'bg-amber-50/40 text-amber-800' },
                    { id: 'lab', title: '🧪 CHALLENGE', desc: 'Solve live scientific reasoning scenarios.', border: 'border-blue-300 hover:border-blue-600', bg: 'bg-blue-50/40 text-blue-900' },
                  ].map(card => (
                    <button
                      key={card.id}
                      onClick={() => setActiveTab(card.id)}
                      className={`border-2 ${card.border} ${card.bg} p-8 rounded-3xl text-left space-y-3 hover:scale-102 transition-all shadow-xs`}
                    >
                      <h3 className="text-2xl font-black">{card.title}</h3>
                      <p className="text-xs text-slate-600 leading-relaxed font-medium">{card.desc}</p>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ABOUT TAB */}
            {activeTab === 'about' && (
              <div className="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 space-y-6 max-w-4xl mx-auto shadow-2xs">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-200 pb-6">
                  <div className="space-y-1">
                    <h2 className="text-2xl font-black text-slate-900">About C.R.E.D.O. System</h2>
                    <p className="text-xs font-mono font-bold text-[#235327]">{FULL_NAME}</p>
                    <p className="text-xs font-semibold text-[#D9383A]">{INSTITUTION}</p>
                    <p className="text-xs text-slate-400 font-semibold mt-1">{CREATOR}</p>
                  </div>
                  <CredoWorldSchoolLogo size="lg" />
                </div>

                <div className="space-y-4 text-xs text-slate-700 leading-relaxed">
                  <h3 className="text-xs font-bold text-[#235327] uppercase tracking-wider">Mission Statement</h3>
                  <p>
                    C.R.E.D.O. (Computational Research & Exploration for Discovery and Observation) is designed as a student research tool for Credo World School Dhanbad. It provides hands-on interactive exposure to hypothesis construction, statistical modeling, machine learning concepts, and experimental design.
                  </p>

                  <h3 className="text-xs font-bold text-[#235327] uppercase tracking-wider">Core Guarantees</h3>
                  <ul className="list-disc list-inside space-y-1 text-slate-600">
                    <li>100% Live AI reasoning: No static pre-scripted outputs.</li>
                    <li>Client-side mathematical integrity: Regression equations, correlation coefficients, and classifier probability weights are calculated directly in client JS.</li>
                    <li>Clean educational interface aligned with official school branding.</li>
                  </ul>
                </div>
              </div>
            )}

          </main>

          {/* CROSS DOMAIN MODAL */}
          {crossDomainInsight && (
            <div className="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-2xl p-6 max-w-2xl w-full space-y-4 shadow-xl">
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[10px] font-bold text-[#235327] uppercase tracking-wider">Cross-Domain Relationship Map</span>
                    <h3 className="text-sm font-bold text-slate-900 mt-0.5">"{crossDomainInsight.finding}"</h3>
                  </div>
                  <button onClick={() => setCrossDomainInsight(null)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <div className="space-y-3">
                  {crossDomainInsight.connections?.map((conn, idx) => (
                    <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                      <span className="text-[#235327] font-bold">{conn.domain}</span>
                      <p className="text-slate-600">{conn.connection}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS MODAL */}
          {showSettings && (
            <div className="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <Icon name="settings" className="w-4 h-4 text-[#235327]" />
                    C.R.E.D.O. System Settings
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">Gemini API Key Override:</label>
                    <input
                      type="password"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      placeholder="Optional API key override..."
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-slate-800 font-mono"
                    />
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1 font-mono text-[11px]">
                    <div className="text-slate-500">System Info:</div>
                    <div className="text-slate-800 font-semibold">{INSTITUTION}</div>
                    <div className="text-slate-600">{CREATOR}</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-4 px-4 text-center text-xs text-slate-500 font-medium">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                <span className="font-bold text-[#235327]">C.R.E.D.O.</span>
                <span>•</span>
                <span className="text-slate-600">{INSTITUTION}</span>
              </div>
              <span className="text-[#D9383A] font-bold">{CREATOR}</span>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
